<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d"><title>声と触覚で描く</title>
<link rel="stylesheet" href="style.css">
</head>
<body><main class="app">
<header><h1>声と触覚で描く 32×32</h1><div class="status" id="capabilities" aria-live="polite"></div></header>
<div class="layout"><section class="work" aria-label="描画エリア">
<nav class="tools" aria-label="色とペン"><div class="palette" id="palette"></div><button class="pen" id="pen" aria-label="ペンを下ろす" aria-pressed="false" title="ペンを上げ下げ">✎</button><button id="undo" aria-label="元に戻す" title="元に戻す">↶</button></nav>
<div class="canvas-area"><div class="canvas-wrap"><canvas id="canvas" width="320" height="320" aria-label="32×32の描画キャンバス"></canvas></div><div id="stat" class="stat" aria-live="polite"></div></div>
</section><aside class="panel" aria-label="音声とその他の機能">
<h2>音声操作</h2><div class="voice-actions"><button id="listen" class="listen" aria-pressed="false">🎙 マイク開始</button><button id="describe">🔊 状態を聞く</button></div><p id="heard" aria-live="polite">ボタンを押して話してください。</p><div id="said" aria-live="polite"></div> 
<button id="clear">⌫ 全消去</button>
<p id="sensorStatus" aria-live="polite">横振りで元に戻す、縦振りでマイク開始</p>
<div class="checks"><span>✓shake:ON</span><span>✓sound:ON</span><span>✓VC:ON</span></div>
<details class="help"><summary>コマンド例</summary><p>右に3 / 下に5 / 中央<br>赤・青・緑・黄色・黒<br>ペンを上げる / 下ろす<br>元に戻す / 全部消す</p></details>
<p class="help">マイクはHTTPSまたは端末内のlocalhostで利用できます。同じWi-FiのHTTP接続ではブラウザー仕様により使えない場合があります。</p>
</aside></div></main>
<script type="module" src="system.js"></script>
</body></html>
