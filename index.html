<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d"><title>声と触覚で描く</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#14213d;background:#f6f4ef;font-size:15px}*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;overflow:hidden}button,input{font:inherit;color:inherit}button{border:2px solid #aab2c0;background:white;border-radius:10px;min-height:42px;padding:6px 10px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e85d04;outline-offset:2px}.app{height:100%;max-width:1100px;margin:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}header{height:40px;display:flex;align-items:center;justify-content:space-between;flex:none}h1{font-size:18px;margin:0}.status{font-size:12px;color:#586174}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}.work{min-height:0;display:grid;grid-template-columns:68px minmax(0,1fr);gap:8px}.tools{display:flex;flex-direction:column;gap:7px;align-items:stretch}.palette{display:flex;flex-direction:column;gap:6px}.swatch{width:44px;min-height:44px;padding:0;border-color:#485267}.swatch[aria-pressed=true]{outline:3px solid #e85d04;outline-offset:1px}.eraser{font-size:11px}.pen{font-size:23px;min-height:52px;padding:2px}.pen[aria-pressed=true]{background:#ffead9;border-color:#e85d04}.canvas-area{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.canvas-wrap{height:min(100%,calc(100vw - 320px));max-height:100%;aspect-ratio:1;max-width:100%;width:auto}.canvas-wrap canvas{display:block;width:100%;height:100%;background:white;border:2px solid #14213d;touch-action:none;image-rendering:pixelated}.stat{font-size:12px;text-align:center;min-height:1.5em}.panel{background:#fff;border:1px solid #d5d9e0;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:0;overflow:auto}.panel h2{font-size:14px;margin:0}.panel button{width:100%}.listen{font-weight:700;min-height:54px!important}.listen.on{background:#a31515;color:#fff}.command{display:flex;gap:5px}.command input{min-width:0;width:100%;border:2px solid #aab2c0;border-radius:8px;padding:7px}.command button{width:auto}.checks{display:grid;grid-template-columns:1fr 1fr;gap:2px;font-size:12px}.checks label:last-child{grid-column:1/-1}.checks input{margin:0 4px 0 0}#heard,#said,#sensorStatus{font-size:12px;line-height:1.35;margin:0;min-height:1em;overflow-wrap:anywhere}.help{font-size:11px;color:#586174;margin:0}.help summary{cursor:pointer}.help p{margin:4px 0}.hidden-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:650px){.app{padding:5px 7px;gap:3px}header{height:29px}h1{font-size:15px}.status{font-size:10px}.layout{grid-template-columns:minmax(0,1fr) 145px;gap:6px}.work{grid-template-columns:43px minmax(0,1fr);gap:5px}.tools{gap:4px}.palette{gap:4px}.swatch{width:37px;min-height:37px}.pen{min-height:44px;font-size:20px}.canvas-wrap{width:min(100%,calc(100dvh - 285px));height:auto}.panel{padding:6px;gap:5px}.panel h2{font-size:12px}button{min-height:38px;padding:5px 7px;font-size:13px}.listen{min-height:48px!important}.help{font-size:10px}}
@media(max-width:370px){.layout{grid-template-columns:minmax(0,1fr) 128px}.work{grid-template-columns:39px minmax(0,1fr)}.swatch{width:34px;min-height:34px}.panel{padding:5px}.help{display:none}}
@media(max-height:580px) and (min-width:500px){.app{padding:4px 10px;gap:3px}header{height:27px}.panel{padding:6px;gap:4px}.layout{grid-template-columns:minmax(0,1fr) 225px}.swatch{width:38px;min-height:38px}}
</style>
<style>
.listen{font-weight:900!important;min-height:88px!important;font-size:25px!important;border:3px solid #14213d!important}
.checks{display:flex;gap:8px;color:#166534;font-size:13px;font-weight:700}.checks span{display:block}
@media(max-width:650px){body{height:100dvh;overflow:hidden}.app{height:100%;min-height:0;padding:5px 7px}.layout{display:flex;flex-direction:column;flex:1;min-height:0;gap:5px}.work{display:flex;flex:0 0 auto;flex-direction:column-reverse;gap:3px}.tools{flex-direction:row;align-items:center;gap:5px}.palette{flex-direction:row;flex-wrap:wrap;gap:4px}.canvas-area{min-height:0}.canvas-wrap{width:min(100%,34dvh);height:auto;min-width:min(100%,150px);max-height:34dvh}.panel{display:grid;grid-template-columns:1fr 1fr;align-content:start;overflow:auto;padding:6px;gap:4px}.panel h2,.panel #listen,.panel #heard,.panel #said,.panel .command,.panel #shake,.panel #sensorStatus,.panel .checks{grid-column:1/-1}.panel .help{display:none}.listen{min-height:88px!important;font-size:30px!important;width:100%}.panel button{min-height:38px}.panel #describe,.panel #clear{width:100%}}
</style></head>
<body><main class="app">
<header><h1>声と触覚で描く 32×32</h1><div class="status" id="capabilities" aria-live="polite"></div></header>
<div class="layout"><section class="work" aria-label="描画エリア">
<nav class="tools" aria-label="色とペン"><div class="palette" id="palette"></div><button class="pen" id="pen" aria-label="ペンを下ろす" aria-pressed="false" title="ペンを上げ下げ">✎</button><button id="undo" aria-label="元に戻す" title="元に戻す">↶</button></nav>
<div class="canvas-area"><div class="canvas-wrap"><canvas id="canvas" width="320" height="320" aria-label="32×32の描画キャンバス"></canvas></div><div id="stat" class="stat" aria-live="polite"></div></div>
</section><aside class="panel" aria-label="音声とその他の機能">
<h2>音声操作</h2><button id="listen" class="listen" aria-pressed="false">🎙 マイク開始</button><p id="heard" aria-live="polite">ボタンを押して話してください。</p><div id="said" aria-live="polite"></div>
<form id="commandForm" class="command"><label class="hidden-label" for="command">コマンド入力</label><input id="command" placeholder="例: 右に3、赤"><button>実行</button></form>
<button id="describe">🔊 状態を聞く</button><button id="clear">⌫ 全消去</button>
<button id="shake">📳 振動操作を有効化</button><p id="sensorStatus" aria-live="polite">横振りで元に戻す、縦振りでマイク開始</p>
<div class="checks"><span>✓ 振動 常時ON</span><span>✓ 効果音 常時ON</span><span>✓ 音声案内 常時ON</span></div>
<details class="help"><summary>コマンド例</summary><p>右に3 / 下に5 / 中央<br>赤・青・緑・黄色・黒<br>ペンを上げる / 下ろす<br>元に戻す / 全部消す</p></details>
<p class="help">マイクはHTTPSまたは端末内のlocalhostで利用できます。同じWi-FiのHTTP接続ではブラウザー仕様により使えない場合があります。</p>
</aside></div></main>
<script>
(()=>{
const $=id=>document.getElementById(id),N=32,cell=10,colors=[null,'#222','#e53935','#1e88e5','#43a047','#fdd835'],names=['消しゴム','黒','赤','青','緑','黄色'];
let grid=Array.from({length:N},()=>Array(N).fill(0)),x=15,y=15,color=1,pen=false,history=[],audio=null,recognition=null,listening=false,sensorEnabled=false,lastShake=0;
const SHAKE_THRESHOLD=11,SHAKE_COOLDOWN=1000;
const canvas=$('canvas'),ctx=canvas.getContext('2d'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('capabilities').textContent=`音声認識 ${SR?'対応':'未対応'} · 振動 ${'vibrate'in navigator?'対応':'未対応'}`;
function save(){history.push({grid:grid.map(r=>r.slice()),x,y,color,pen});if(history.length>30)history.shift()}
function speak(message,always=false){$('said').textContent=message;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='ja-JP';speechSynthesis.speak(u)}}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,320,320);for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(grid[j][i]){ctx.fillStyle=colors[grid[j][i]];ctx.fillRect(i*cell,j*cell,cell,cell)}ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=N;i++){ctx.moveTo(i*cell+.5,0);ctx.lineTo(i*cell+.5,320);ctx.moveTo(0,i*cell+.5);ctx.lineTo(320,i*cell+.5)}ctx.stroke();ctx.strokeStyle='#e85d04';ctx.lineWidth=2;ctx.strokeRect(x*cell+1,y*cell+1,8,8);if(pen){ctx.fillStyle='#e85d04';ctx.fillRect(x*cell+3,y*cell+3,4,4)}$('stat').textContent=`横${x+1} 縦${y+1} · ${pen?'ペン下':'ペン上'} · ${names[color]}`;$('pen').setAttribute('aria-pressed',String(pen));$('pen').setAttribute('aria-label',pen?'ペンを上げる':'ペンを下ろす');$('pen').title=pen?'ペンを上げる':'ペンを下ろす';document.querySelectorAll('.swatch').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===color)))}
function undo(){if(!history.length){speak('戻せる操作はありません');return}({grid,x,y,color,pen}=history.pop());draw();speak('元に戻しました')}
function describe(){let count=Array(6).fill(0),left=32,right=-1,top=32,bottom=-1;grid.forEach((r,j)=>r.forEach((v,i)=>{if(v){count[v]++;left=Math.min(left,i);right=Math.max(right,i);top=Math.min(top,j);bottom=Math.max(bottom,j)}}));const total=count.reduce((a,b)=>a+b,0);if(!total)return `まだ何も描かれていません。カーソルは横${x+1}、縦${y+1}です。`;const parts=count.map((n,i)=>n?`${names[i]}が${n}マス`:null).filter(Boolean).join('、');return `${parts}が描かれています。合計${total}マスです。範囲は横${left+1}から${right+1}、縦${top+1}から${bottom+1}です。`}
function effect(){if(navigator.vibrate)navigator.vibrate([70,45,70]);try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.value=.12;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}
function effect(pattern=[70,45,70]){if(navigator.vibrate)navigator.vibrate(pattern);try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.value=.12;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}
function traceFeedback(wasDrawn){effect(wasDrawn?[12]:[24,20,24])}
function command(input){const t=input.replace(/\s/g,'');if(!t)return;$('heard').textContent=`認識: ${input}`;if(/元に戻す|取り消し|undo/i.test(t)){undo();return}if(/状態|描かれ|説明/.test(t)){speak(describe(),true);return}if(/全部消|全消去|クリア/.test(t)){save();grid=Array.from({length:N},()=>Array(N).fill(0));draw();speak('全部消しました');return}if(/ペン.*(上げ|あげ)/.test(t)){save();pen=false;draw();speak('ペンを上げました');return}if(/ペン.*(下ろ|おろ)/.test(t)){save();pen=true;grid[y][x]=color;draw();speak('ペンを下ろしました');return}for(const [re,k]of [[/消しゴム/,0],[/黒/,1],[/赤/,2],[/青/,3],[/緑/,4],[/黄色|黄/,5]])if(re.test(t)){save();color=k;draw();speak(`${names[k]}を選びました`);return}const dict={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10},n=Number((t.match(/\d+/)||[])[0])||dict[(t.match(/[一二三四五六七八九十]/)||[])[0]]||1;let dx=0,dy=0;if(/右/.test(t))dx=1;else if(/左/.test(t))dx=-1;else if(/上|うえ/.test(t))dy=-1;else if(/下|した/.test(t))dy=1;else if(/中央|真ん中/.test(t)){save();x=15;y=15;draw();speak('中央に移動しました');return}else if(/塗|点を打/.test(t)){save();grid[y][x]=color;draw();effect();return}else{speak('コマンドを認識できませんでした');return}save();x=Math.max(0,Math.min(31,x+dx*n));y=Math.max(0,Math.min(31,y+dy*n));if(pen)grid[y][x]=color;draw();effect();speak(`横${x+1}、縦${y+1}に移動しました`)}
colors.forEach((v,i)=>{const b=document.createElement('button');b.className='swatch';b.style.background=v||'#fff';b.textContent=v?'': '消';b.title=names[i];b.setAttribute('aria-label',names[i]);b.setAttribute('aria-pressed',String(i===color));b.addEventListener('click',()=>{save();color=i;draw();speak(`${names[i]}を選びました`)});$('palette').append(b)});
$('pen').addEventListener('click',()=>{save();pen=!pen;if(pen)grid[y][x]=color;draw();speak(pen?'ペンを下ろしました':'ペンを上げました')});$('undo').addEventListener('click',undo);$('describe').addEventListener('click',()=>speak(describe(),true));$('clear').addEventListener('click',()=>command('全部消す'));
$('commandForm').addEventListener('submit',e=>{e.preventDefault();command($('command').value);$('command').value='' });
$('listen').addEventListener('click',()=>{if(listening){recognition.stop();return}if(!SR){speak('このブラウザーは音声認識に対応していません');return}recognition=new SR();recognition.lang='ja-JP';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const text=e.results[i][0].transcript;if(e.results[i].isFinal)command(text);else $('heard').textContent=`聞き取り中: ${text}`}};recognition.onerror=e=>$('heard').textContent=`音声認識エラー: ${e.error}`;recognition.onend=()=>{listening=false;$('listen').classList.remove('on');$('listen').textContent='🎙 マイク開始';$('listen').setAttribute('aria-pressed','false')};try{recognition.start();listening=true;$('listen').classList.add('on');$('listen').textContent='■ マイク停止';$('listen').setAttribute('aria-pressed','true')}catch{$('heard').textContent='マイクを開始できません。接続とブラウザーの許可を確認してください。'}});
let gravity={x:0,y:0,z:0},hasGravity=false;
function motion(e){const a=e.acceleration;if(a&&[a.x,a.y,a.z].every(Number.isFinite)){triggerShake(a);return}const g=e.accelerationIncludingGravity;if(!g||![g.x,g.y,g.z].every(Number.isFinite))return;if(!hasGravity){gravity={x:g.x,y:g.y,z:g.z};hasGravity=true;return}const delta={x:g.x-gravity.x,y:g.y-gravity.y,z:g.z-gravity.z};gravity={x:gravity.x*.8+g.x*.2,y:gravity.y*.8+g.y*.2,z:gravity.z*.8+g.z*.2};triggerShake(delta)}
function triggerShake(delta={x:0,y:0,z:0}){const horizontal=Math.abs(delta.x)>=Math.abs(delta.y);const strength=horizontal?Math.abs(delta.x):Math.abs(delta.y);if(strength<SHAKE_THRESHOLD||Date.now()-lastShake<SHAKE_COOLDOWN)return;lastShake=Date.now();if(horizontal){$('sensorStatus').textContent='横振りを検出しました。元に戻します。';undo()}else{$('sensorStatus').textContent='縦振りを検出しました。マイクを開始します。';if(!listening)$('listen').click()}effect([35])}
$('shake').addEventListener('click',async()=>{const D=window.DeviceMotionEvent;if(sensorEnabled){removeEventListener('devicemotion',motion);sensorEnabled=false;hasGravity=false;$('shake').textContent='📳 振動操作を有効化';$('sensorStatus').textContent='振動操作を停止しました';return}if(!D){$('sensorStatus').textContent='この端末は加速度センサーに対応していません';return}try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')await audio.resume()}catch{}if(typeof D.requestPermission==='function'){try{if(await D.requestPermission()!=='granted')throw Error()}catch{$('sensorStatus').textContent='センサーの許可が必要です';return}}addEventListener('devicemotion',motion,{passive:true});sensorEnabled=true;$('shake').textContent='振動操作を無効化';$('sensorStatus').textContent='センサー待機中です。端末を振ってください'});
function cellAt(e){const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(31,Math.floor((e.clientX-r.left)/r.width*32))),Math.max(0,Math.min(31,Math.floor((e.clientY-r.top)/r.height*32)))]}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);save();[x,y]=cellAt(e);const wasDrawn=Boolean(grid[y][x]);if(pen)grid[y][x]=color;traceFeedback(wasDrawn);draw()});canvas.addEventListener('pointermove',e=>{if(!e.buttons)return;const[a,b]=cellAt(e);if(a===x&&b===y)return;x=a;y=b;const wasDrawn=Boolean(grid[y][x]);if(pen)grid[y][x]=color;traceFeedback(wasDrawn);draw()});draw();
})();
</script></body></html>
